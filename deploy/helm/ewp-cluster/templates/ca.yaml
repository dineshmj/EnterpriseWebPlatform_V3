# The root: self-signed once, its key kept in cert-manager's namespace only.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ca.issuerName }}-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ca.issuerName }}
  namespace: {{ .Values.trustNamespace }}
spec:
  isCA: true
  commonName: {{ .Values.ca.commonName | quote }}
  secretName: {{ .Values.ca.issuerName }}
  duration: {{ .Values.ca.duration }}
  renewBefore: {{ .Values.ca.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.ca.issuerName }}-bootstrap
---
# Signs every EWP Service's certificate (deploy/helm/ewp, global.tls.issuerRef).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ca.issuerName }}
spec:
  ca:
    secretName: {{ .Values.ca.issuerName }}