# Only for deploy/helm/check-charts.sh: a render with every kind of entry. The real list is written
# by .github/scripts/demo-secrets.mjs at Demo up.
keyVault:
  name: kv-ewp-demo-check
  tenantId: 00000000-0000-0000-0000-000000000000
  clientId: 00000000-0000-0000-0000-000000000000
secrets:
  - name: ewp-shell
    keys:
      - {key: ConnectionStrings__MenuDbConnection, object: conn-ewp-shell-menu}
  - name: ewp-shell-client-key
    keys:
      - {key: client-key.pem, object: client-private-key-shell}
      - {key: client-key.pem.password, object: client-private-key-password-shell}
  - name: ewp-idp
    keys:
      - {key: ClientSecrets__Audit.JourneyApi.ClientID, object: client-Audit-JourneyApi-ClientID}
  - name: ewp-idp-signing
    keys:
      - {key: signing.pfx, object: pki-idp-signing-pfx, encoding: base64}