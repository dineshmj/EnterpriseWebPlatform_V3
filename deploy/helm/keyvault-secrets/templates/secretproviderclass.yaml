{{- /*
┌─ :: SECURITY :: Which Key Vault secret becomes which Kubernetes Secret key ────────────────────
│ Why : A missing or misspelt mapping must fail here, at install, not as a pod that cannot start.
│ How : Every object is fetched once (an object feeding several keys is listed once); each
│       Secret takes its keys from the fetched objects. The Secrets carry this release's labels,
│       and the driver deletes them when no pod mounts the class any more.
│ Ref : values.yaml | Secrets Store CSI driver "Sync as Kubernetes Secret"
└────────────────────────────────────────────────────────────────────────────────────────────────
*/ -}}
{{- $kv := .Values.keyVault -}}
{{- $secrets := required "secrets is required: the Secrets this namespace needs" .Values.secrets -}}
{{- $objects := dict -}}
{{- range $secrets }}
{{- range .keys }}
{{- $encoding := .encoding | default "utf-8" }}
{{- if and (hasKey $objects .object) (ne (get $objects .object) $encoding) }}
{{- fail (printf "Key Vault secret %s is used with two encodings" .object) }}
{{- end }}
{{- $_ := set $objects .object $encoding }}
{{- end }}
{{- end -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: keyvault-secrets
  labels:
    {{- include "kvs.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    {{- range $secrets }}
    - secretName: {{ required "secrets[].name is required" .name }}
      type: Opaque
      labels:
        {{- include "kvs.labels" $ | nindent 8 }}
      data:
        {{- range (required (printf "secrets[%s].keys is required" .name) .keys) }}
        - objectName: {{ required "keys[].object is required" .object }}
          key: {{ required "keys[].key is required" .key }}
        {{- end }}
    {{- end }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "keyVault.clientId is required" $kv.clientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" $kv.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required" $kv.tenantId | quote }}
    objects: |
      array:
        {{- range $name, $encoding := $objects }}
        - |
          objectName: {{ $name }}
          objectType: secret
          objectEncoding: {{ $encoding }}
        {{- end }}