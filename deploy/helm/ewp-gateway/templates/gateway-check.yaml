{{- /*
┌─ :: OBSERVABILITY :: The gateway check ────────────────────────────────────────────────────────
│ Why : Before 35 services go in, one request should prove the public path end to end: DNS ->
│       public IP -> load balancer -> Envoy -> TLS with the Let's Encrypt certificate.
│ How : A route on the https listener whose answer Envoy writes itself (Envoy Gateway's direct
│       response filter): no pod, no image. "Demo up" calls it and fails the run if it does not
│       answer 200 with this body.
│ Ref : doc/Cloud-Demo.md | Envoy Gateway "HTTPRouteFilter"
└────────────────────────────────────────────────────────────────────────────────────────────────
*/ -}}
{{- if .Values.gatewayCheck.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: gateway-check
  namespace: {{ .Release.Namespace }}
spec:
  directResponse:
    statusCode: 200
    contentType: text/plain
    body:
      type: Inline
      inline: "EWP gateway OK"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-check
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: https
  hostnames:
    - {{ .Values.gatewayCheck.host }}.{{ required "domain is required" .Values.domain }}
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: gateway-check
{{- end }}