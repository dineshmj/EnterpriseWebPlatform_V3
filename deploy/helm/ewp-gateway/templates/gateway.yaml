{{- /*
┌─ :: SECURITY :: The Gateway: https for the browser, http only to prove and to redirect ────────
│ Why : Browsers must only ever talk to EWP over TLS with a publicly trusted certificate, yet
│       Let's Encrypt's HTTP-01 check and a typed "http://" address arrive on port 80.
│ How : Listener "https" (443) ends TLS with the public certificate and admits routes only from
│       namespaces labelled for it (the EWP chart's routes name this listener: sectionName
│       https). Listener "http" (80) admits routes from this namespace only: cert-manager's
│       HTTP-01 answers (exact paths under /.well-known/acme-challenge/, which win over a
│       prefix) and one redirect of everything else to https.
│ Ref : doc/Cloud-Demo.md | doc/Kubernetes.md K4 | OWASP ASVS V12.1 | RFC 8555 section 8.3
└────────────────────────────────────────────────────────────────────────────────────────────────
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ewp-public-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{ .Values.gateway.routeNamespaceLabel }}: "true"
    {{- if .Values.partnerBank.enabled }}
    {{- $pb := .Values.partnerBank }}
    {{- $domain := required "partnerBank.domain is required when the Partner Bank is enabled" $pb.domain }}
    {{- range $pb.listeners }}
    # The Partner Bank, {{ .host }}:{{ .port }} ({{ if eq .tls "Terminate" }}the browser's TLS ends here{{ else }}TLS passed through to the pod{{ end }}).
    - name: {{ .name }}
      protocol: {{ ternary "HTTPS" "TLS" (eq .tls "Terminate") }}
      port: {{ .port }}
      hostname: {{ .host }}.{{ $domain }}
      tls:
        mode: {{ .tls }}
        {{- if eq .tls "Terminate" }}
        certificateRefs:
          - kind: Secret
            name: partner-bank-public-tls
        {{- end }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{ $pb.routeNamespaceLabel }}: "true"
        {{- if eq .tls "Passthrough" }}
        kinds:
          - kind: TLSRoute
        {{- end }}
    {{- end }}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301