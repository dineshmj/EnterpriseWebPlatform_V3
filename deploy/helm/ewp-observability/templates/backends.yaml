{{- /*
┌─ :: ARCHITECTURE + RESILIENCE :: The three stores behind the collector ────────────────────────
│ Why : Metrics, logs and traces each need their own store; Grafana reads all three and links
│       them (a log line's trace ID opens the trace, a trace opens its logs).
│ How : One instance each, single-process mode, data on an emptyDir with a size limit (the demo
│       is torn down after a few hours; a pod restart starts empty - accepted for a demo).
│         Prometheus  9090  its native OTLP receiver; resource attributes promoted to labels
│         Loki        3100  OTLP logs in, filesystem storage, retention
│         Tempo       4317  OTLP traces in (from the collector), 3200 queries (Grafana)
│       Every one accepts only the collector and Grafana (networkpolicies.yaml); none calls out.
│ Ref : values.yaml (box) | Prometheus "OTLP receiver" | Loki "monolithic mode" | Tempo "single binary"
└────────────────────────────────────────────────────────────────────────────────────────────────
*/ -}}
{{- define "obs.prometheusConfig" -}}
global:
  scrape_interval: 30s
  evaluation_interval: 30s
# OTLP in: who sent a series (service.name -> job, service.instance.id -> instance) plus these.
otlp:
  promote_resource_attributes:
    - service.namespace
    - deployment.environment.name
storage:
  tsdb:
    # OTLP batches can arrive a little late; accept them instead of dropping them.
    out_of_order_time_window: 30m
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
{{- end -}}
{{- define "obs.lokiConfig" -}}
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: {{ .Values.loki.retention }}
  allow_structured_metadata: true
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
pattern_ingester:
  enabled: false
analytics:
  reporting_enabled: false
{{- end -}}
{{- define "obs.tempoConfig" -}}
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: {{ .Values.tempo.retention }}
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
{{- end -}}
{{- $root := . -}}
{{- range $name, $b := dict
      "prometheus" (dict "v" .Values.prometheus "config" "prometheus.yml" "template" "obs.prometheusConfig" "mount" "/etc/prometheus" "data" "/prometheus" "ready" "/-/ready"
                         "ports" (list (dict "name" "http" "port" 9090))
                         "args" (list "--config.file=/etc/prometheus/prometheus.yml" "--storage.tsdb.path=/prometheus" (printf "--storage.tsdb.retention.time=%s" .Values.prometheus.retention) "--web.enable-otlp-receiver"))
      "loki" (dict "v" .Values.loki "config" "loki.yaml" "template" "obs.lokiConfig" "mount" "/etc/loki" "data" "/loki" "ready" "/ready"
                   "ports" (list (dict "name" "http" "port" 3100))
                   "args" (list "-config.file=/etc/loki/loki.yaml" "-target=all"))
      "tempo" (dict "v" .Values.tempo "config" "tempo.yaml" "template" "obs.tempoConfig" "mount" "/etc/tempo" "data" "/var/tempo" "ready" "/ready"
                    "ports" (list (dict "name" "http" "port" 3200) (dict "name" "otlp-grpc" "port" 4317))
                    "args" (list "-config.file=/etc/tempo/tempo.yaml" "-target=all"))
}}
{{- $ctx := dict "root" $root "name" $name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
data:
  {{ $b.config }}: |
    {{- include $b.template $root | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # One store, one writer: the old pod stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "obs.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "obs.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include $b.template $root | sha256sum }}
    spec:
      {{- include "obs.podSecurity" $b.v | nindent 6 }}
      containers:
        - name: {{ $name }}
          image: {{ $b.v.image }}
          imagePullPolicy: IfNotPresent
          args:
            {{- toYaml $b.args | nindent 12 }}
          ports:
            {{- range $b.ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
            {{- end }}
          securityContext:
            {{- include "obs.containerSecurity" $root | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ $b.ready }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $b.v.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: {{ $b.mount }}
              readOnly: true
            - name: data
              mountPath: {{ $b.data }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: data
          emptyDir:
            sizeLimit: {{ $b.v.storage }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "obs.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "obs.selector" $ctx | nindent 4 }}
  ports:
    {{- range $b.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      {{- if eq .name "otlp-grpc" }}
      appProtocol: grpc
      {{- end }}
    {{- end }}
{{- end }}