# ┌─ :: SECURITY :: Keeping pinned things current ─────────────────────────────────────────────────
# │ Why : The workflow pins actions to commit SHAs and the Dockerfiles pin base images by tag AND
# │       digest. Pinning stops silent changes; without updates it would also stop security fixes.
# │ How : Dependabot proposes a pull request a week per ecosystem (all base images in one); the
# │       image workflow builds and scans each proposal before it can be merged. NuGet too (all
# │       packages in one pull request): the hand-made routine (Scan-Dependencies.ps1) missed the
# │       .NET 10.0.14 security release (27-OCT-2026), and the CI gate cannot see fixes that are
# │       in the runtime rather than in a package advisory. pnpm stays with its routine (pnpm
# │       audit at every export; outdated checked whenever a Node project is worked on).
# │ Ref : doc/Containers.md | OWASP A06 Vulnerable and Outdated Components
# └────────────────────────────────────────────────────────────────────────────────────────────────
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The cloud demo's Terraform providers (exact versions + .terraform.lock.hcl checksums).
  - package-ecosystem: terraform
    directory: /deploy/terraform/demo
    schedule:
      interval: weekly

  - package-ecosystem: docker
    # Every folder with a Dockerfile (doc/Containers.md, "Adding an image").
    directories:
      - /src/AsyncWorkflows/Publishers/CustomerOnboarding/CustomerOutboxPublisher
      - /src/AsyncWorkflows/Subscribers/Accounts/AccountApplicationOpeningSubscriber
      - /src/AsyncWorkflows/Subscribers/Accounts/AccountsCommandSubscriber
      - /src/AsyncWorkflows/Subscribers/Compliance/ComplianceCaseOpeningSubscriber
      - /src/AsyncWorkflows/Subscribers/CustomerKyc/KycCaseOpeningSubscriber
      - /src/AsyncWorkflows/Subscribers/CustomerOnboarding/OnboardingOutcomeSubscriber
      - /src/AsyncWorkflows/Subscribers/DocumentsManagement/DocumentInvalidationSubscriber
      - /src/AsyncWorkflows/Subscribers/Notifications/NotificationsSubscriber
      - /src/AsyncWorkflows/Subscribers/Payments/PaymentsSagaReplySubscriber
      - /src/IDP
      - /src/Microservices/Accounts/API
      - /src/Microservices/Accounts/BFF.Web
      - /src/Microservices/Audit/API
      - /src/Microservices/Audit/BFF.Web
      - /src/Microservices/Audit/JourneyApi
      - /src/Microservices/Compliance/API
      - /src/Microservices/Compliance/BFF.Web
      - /src/Microservices/CustomerKyc/API
      - /src/Microservices/CustomerKyc/BFF.Web
      - /src/Microservices/CustomerOnboarding/API
      - /src/Microservices/CustomerOnboarding/BFF.Web
      - /src/Microservices/DocumentsManagement/API
      - /src/Microservices/Notifications/API
      - /src/Microservices/Operations/BFF.Web
      - /src/Microservices/Operations/JourneyApi
      - /src/Microservices/PartnerProducts/API
      - /src/Microservices/PartnerProducts/BFF.Web
      - /src/Microservices/PartnerProducts/JourneyApi
      - /src/Microservices/PartnerProducts/Worker
      - /src/Microservices/Payments/API
      - /src/Microservices/Payments/BFF.Web
      - /src/Shell
      - /src/Simulators/CoreBankingSimulator
      - /src/Simulators/PaymentNetworkSimulator
      - /src/Simulators/ScreeningProviderSimulator
    schedule:
      interval: weekly
    # ┌─ ARCH ─────────────────────────────────────────────────────────────────────────────────────
    # │ Minor and patch updates only (security fixes, e.g. .NET 10.0.13 -> 10.0.14). A new major
    # │ (Node 24 -> 26, .NET 10 -> 11) is a planned step: local install, every project and the
    # │ images together - otherwise CI would build with another runtime than development tests.
    # └────────────────────────────────────────────────────────────────────────────────────────────
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    # ┌─ ARCH ─────────────────────────────────────────────────────────────────────────────────────
    # │ One pull request for every base image move: the 35 Dockerfiles share four base images,
    # │ and a digest moves whenever its publisher rebuilds (distroless: with each Debian fix).
    # │ One PR, built and scanned as a whole, keeps all images on the same base.
    # └────────────────────────────────────────────────────────────────────────────────────────────
    groups:
      base-images:
        patterns: ['*']

  - package-ecosystem: nuget
    # Every folder with a .csproj, the test projects included (doc/Containers.md, "Adding an image").
    directories:
      - /src/AsyncWorkflows/Contracts
      - /src/AsyncWorkflows/Infrastructure/Kafka
      - /src/AsyncWorkflows/Infrastructure/Subscribers
      - /src/AsyncWorkflows/Publishers/CustomerOnboarding/CustomerOutboxPublisher
      - /src/AsyncWorkflows/Subscribers/Accounts/AccountApplicationOpeningSubscriber
      - /src/AsyncWorkflows/Subscribers/Accounts/AccountsCommandSubscriber
      - /src/AsyncWorkflows/Subscribers/Compliance/ComplianceCaseOpeningSubscriber
      - /src/AsyncWorkflows/Subscribers/CustomerKyc/KycCaseOpeningSubscriber
      - /src/AsyncWorkflows/Subscribers/CustomerOnboarding/OnboardingOutcomeSubscriber
      - /src/AsyncWorkflows/Subscribers/DocumentsManagement/DocumentInvalidationSubscriber
      - /src/AsyncWorkflows/Subscribers/Notifications/NotificationsSubscriber
      - /src/AsyncWorkflows/Subscribers/Payments/PaymentsSagaReplySubscriber
      - /src/Common/Observability
      - /src/Common/WebUtilities
      - /src/IDP
      - /src/Microservices/Accounts/API
      - /src/Microservices/Accounts/BFF.Web
      - /src/Microservices/Audit/API
      - /src/Microservices/Compliance/API
      - /src/Microservices/Compliance/BFF.Web
      - /src/Microservices/CustomerKyc/API
      - /src/Microservices/CustomerOnboarding/API
      - /src/Microservices/CustomerOnboarding/BFF.Web
      - /src/Microservices/DocumentsManagement/API
      - /src/Microservices/Notifications/API
      - /src/Microservices/PartnerProducts/API
      - /src/Microservices/Payments/API
      - /src/Microservices/Payments/BFF.Web
      - /src/Shell
      - /src/Simulators/CoreBankingSimulator
      - /src/Simulators/PaymentNetworkSimulator
      - /src/Simulators/ScreeningProviderSimulator
      - /tst/dotnet/Accounts.Api.Tests
      - /tst/dotnet/IDP.Tests
      - /tst/dotnet/PartnerProducts.Api.Tests
      - /tst/dotnet/Payments.Api.Tests
    schedule:
      interval: weekly
    # ┌─ ARCH ─────────────────────────────────────────────────────────────────────────────────────
    # │ As for the images: minor and patch only - a major (.NET 11, Duende 9) is a planned step.
    # │ One pull request for all packages, so the Microsoft.* packages move as one release across
    # │ the 36 projects; that release's runtime image comes in the base-images pull request -
    # │ merge the two together. The Partner Bank's repository proposes the same the same week.
    # └────────────────────────────────────────────────────────────────────────────────────────────
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      nuget-packages:
        patterns: ['*']