# ┌─ :: SECURITY :: Keeping pinned things current ─────────────────────────────────────────────────
# │ Why : The workflow pins actions to commit SHAs and the Dockerfiles pin exact base image tags.
# │       Pinning stops silent changes; without updates it would also stop security fixes.
# │ How : Dependabot proposes a pull request a week per ecosystem; the image workflow builds and
# │       scans each proposal before it can be merged. NuGet and pnpm stay with the existing
# │       routine (Scan-Dependencies.ps1, pnpm audit at every export).
# │ Ref : doc/Containers.md | OWASP A06 Vulnerable and Outdated Components
# └────────────────────────────────────────────────────────────────────────────────────────────────
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    # Every folder with a Dockerfile (doc/Containers.md, "Adding an image").
    directories:
      - /src/AsyncWorkflows/Publishers/CustomerOnboarding/CustomerOutboxPublisher
      - /src/AsyncWorkflows/Subscribers/Accounts/AccountApplicationOpeningSubscriber
      - /src/AsyncWorkflows/Subscribers/Accounts/AccountsCommandSubscriber
      - /src/AsyncWorkflows/Subscribers/Compliance/ComplianceCaseOpeningSubscriber
      - /src/AsyncWorkflows/Subscribers/CustomerKyc/KycCaseOpeningSubscriber
      - /src/AsyncWorkflows/Subscribers/CustomerOnboarding/OnboardingOutcomeSubscriber
      - /src/AsyncWorkflows/Subscribers/DocumentsManagement/DocumentInvalidationSubscriber
      - /src/AsyncWorkflows/Subscribers/Notifications/NotificationsSubscriber
      - /src/AsyncWorkflows/Subscribers/Payments/PaymentsSagaReplySubscriber
      - /src/IDP
      - /src/Microservices/Accounts/API
      - /src/Microservices/Accounts/BFF.Web
      - /src/Microservices/Audit/API
      - /src/Microservices/Audit/BFF.Web
      - /src/Microservices/Audit/JourneyApi
      - /src/Microservices/Compliance/API
      - /src/Microservices/Compliance/BFF.Web
      - /src/Microservices/CustomerKyc/API
      - /src/Microservices/CustomerKyc/BFF.Web
      - /src/Microservices/CustomerOnboarding/API
      - /src/Microservices/CustomerOnboarding/BFF.Web
      - /src/Microservices/DocumentsManagement/API
      - /src/Microservices/Notifications/API
      - /src/Microservices/Operations/BFF.Web
      - /src/Microservices/Operations/JourneyApi
      - /src/Microservices/PartnerProducts/API
      - /src/Microservices/PartnerProducts/BFF.Web
      - /src/Microservices/PartnerProducts/JourneyApi
      - /src/Microservices/PartnerProducts/Worker
      - /src/Microservices/Payments/API
      - /src/Microservices/Payments/BFF.Web
      - /src/Shell
      - /src/Simulators/CoreBankingSimulator
      - /src/Simulators/PaymentNetworkSimulator
      - /src/Simulators/ScreeningProviderSimulator
    schedule:
      interval: weekly
    # ┌─ ARCH ─────────────────────────────────────────────────────────────────────────────────────
    # │ Minor and patch updates only (security fixes, e.g. .NET 10.0.13 -> 10.0.14). A new major
    # │ (Node 24 -> 26, .NET 10 -> 11) is a planned step: local install, every project and the
    # │ images together - otherwise CI would build with another runtime than development tests.
    # └────────────────────────────────────────────────────────────────────────────────────────────
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']