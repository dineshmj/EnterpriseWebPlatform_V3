# ┌─ :: ARCHITECTURE + SECURITY :: Code scanning - findings reported, not (yet) gating ───────────
# │ Why : The CI gates catch known-vulnerable packages and broken builds, not a flaw in our own
# │       code (an injection, a missing check, a secret in a log). Three scanners look at the
# │       code from different sides: CodeQL (GitHub, data flow), SonarQube Cloud (quality +
# │       security hotspots, one view of C# and TypeScript) and Snyk (dependencies, with fix
# │       advice and alerts on new advisories against what main ships).
# │ How : NON-BLOCKING FIRST: none of these jobs is part of "CI result", so a finding never
# │       stops a merge. Results go to Security -> Code scanning (CodeQL, Snyk SARIF) and to
# │       SonarQube Cloud. Once the backlog of findings is triaged, a gate can be added.
# │       SonarQube Cloud and Snyk need an account and a token (SONAR_TOKEN, SNYK_TOKEN repo
# │       secrets); without them their steps skip themselves and say so on the summary. Fork
# │       and Dependabot pull requests get no secrets, so they skip too.
# │       Weekly schedule as well: new queries and new advisories find issues in unchanged code.
# │       Actions are pinned to commit SHAs; tools are pinned and checksum-verified.
# │ Ref : doc/CI.md | OWASP A03, A06, A08 | OWASP ASVS V14
# └────────────────────────────────────────────────────────────────────────────────────────────────
name: Code scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# SEC: read-only by default; only the jobs that upload results get security-events: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: '10.0.403'
  NODE_VERSION: '24.22.1'
  # NOTE: same pnpm as ci.yml (the lockfiles are written by it).
  PNPM_VERSION: '12.11.2'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # ┌─ SEC ──────────────────────────────────────────────────────────────────────────────────────────
  # │ CodeQL without a build (build-mode none): C# and TypeScript are read from source, so the
  # │ scan does not depend on the build and finishes in minutes. The workflows themselves are
  # │ scanned too (actions: script injection, over-broad tokens). security-extended = the
  # │ default queries plus the lower-precision security ones.
  # └────────────────────────────────────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript, actions]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/.next/**'
              - '**/wwwroot/lib/**'
              - test-results

      - name: Analyse
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # ┌─ SEC ──────────────────────────────────────────────────────────────────────────────────────────
  # │ SonarQube Cloud, CI-based analysis (Automatic Analysis must be OFF in the project, or the
  # │ two clash). The scanner for .NET wraps the Release build of the solution and also picks up
  # │ the TypeScript files outside the .NET projects, so one project shows both. The token goes
  # │ to the scanner only; organisation and project key are repo variables, defaulting to
  # │ SonarQube Cloud's own names for an imported GitHub repository.
  # └────────────────────────────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'dineshmj' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'dineshmj_EnterpriseWebPlatform_V3' }}
      SONARSCANNER_VERSION: '12.0.0'
    steps:
      - name: Skipped - no SONAR_TOKEN secret
        if: env.SONAR_TOKEN == ''
        run: echo "### SonarQube Cloud skipped - no SONAR_TOKEN secret (doc/CI.md, Code scanning)" >> "$GITHUB_STEP_SUMMARY"

      # NOTE: full history, so new code and blame are attributed correctly.
      - name: Check out
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      # The JavaScript / TypeScript analyser runs on Node.
      - name: Set up Node
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get the scanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install dotnet-sonarscanner --version "$SONARSCANNER_VERSION" --tool-path "$RUNNER_TEMP/sonar"

      - name: Set up pnpm
        if: env.SONAR_TOKEN != ''
        run: npm install --global --ignore-scripts "pnpm@${PNPM_VERSION}"

      # ┌─ SEC ────────────────────────────────────────────────────────────────────────────────────
      # │ The pinned WireMock release the Jest tests start, kept only when its SHA-256 is the one
      # │ recorded here. NOTE: same version and checksum as ci.yml - change both together.
      # └──────────────────────────────────────────────────────────────────────────────────────────
      - name: Get WireMock
        if: env.SONAR_TOKEN != ''
        env:
          WIREMOCK_VERSION: '3.13.2'
          WIREMOCK_SHA256: 'd097b19bd483c5038479b13a5c71e9faf8f2f5106584f0c120a7770ab0bdb367'
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/wiremock-standalone-$WIREMOCK_VERSION.jar"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$jar" "https://repo1.maven.org/maven2/org/wiremock/wiremock-standalone/$WIREMOCK_VERSION/wiremock-standalone-$WIREMOCK_VERSION.jar"
          echo "$WIREMOCK_SHA256  $jar" | sha256sum --check --strict
          echo "WIREMOCK_JAR=$jar" >> "$GITHUB_ENV"

      # ┌─ ARCH ─────────────────────────────────────────────────────────────────────────────────────
      # │ Coverage for SonarQube Cloud: the same Jest tests as ci.yml, found the same way (every
      # │ project under src whose package.json has a "test" script), run with lcov output. Jest
      # │ writes paths relative to its project, so each report's SF: lines get the project folder
      # │ in front - SonarQube Cloud matches them from the repository root.
      # └────────────────────────────────────────────────────────────────────────────────────────────
      - name: TypeScript unit tests with coverage
        if: env.SONAR_TOKEN != ''
        run: |
          set -euo pipefail
          reports=()
          while read -r file; do
            dir=$(dirname "$file")
            [[ $(jq -r '.scripts.test // empty' "$file") ]] || continue
            echo "::group::$dir"
            (cd "$dir" \
              && pnpm install --frozen-lockfile --ignore-scripts \
              && pnpm test --coverage --coverageReporters=lcov --coverageDirectory=coverage)
            sed -i "s#^SF:#SF:$dir/#" "$dir/coverage/lcov.info"
            reports+=("$dir/coverage/lcov.info")
            echo "::endgroup::"
          done < <(git ls-files 'src/**/package.json')
          echo "LCOV_REPORTS=$(IFS=,; echo "${reports[*]}")" >> "$GITHUB_ENV"

      # ┌─ ARCH ─────────────────────────────────────────────────────────────────────────────────────
      # │ Duplication by design: every micro front end, BFF and API is its squad's own deployable,
      # │ built on the stack that squad chose, so their start-up and plumbing files look alike and
      # │ are deliberately NOT shared through a central project. sonar.cpd.exclusions takes only
      # │ those scaffold files out of the DUPLICATION count; every bug, vulnerability and hotspot
      # │ rule still runs on them. Named file by file, so copy-paste in business code still shows.
      # │ (NOSONAR and #pragma cannot do this: they silence issues, not duplication.)
      # ├─ ARCH ─────────────────────────────────────────────────────────────────────────────────────
      # │ Coverage: the .NET unit tests (tst/dotnet/EwpTests.slnx) run INSIDE begin/end with
      # │ coverlet writing OpenCover; the Jest lcov reports come from the step above.
      # │ sonar.coverage.exclusions leaves out only what is tested another way or not meant for
      # │ unit tests: start-up (Program.cs, Nest main.ts), the BFFs and client apps and the Shell
      # │ (Playwright), the simulators, the tests themselves, scripts and deployment. Domain APIs
      # │ and workflows WITHOUT unit tests stay in the count - that gap is real.
      # └────────────────────────────────────────────────────────────────────────────────────────────
      - name: Build, test and analyse
        if: env.SONAR_TOKEN != ''
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/sonar/dotnet-sonarscanner"
          "$scanner" begin \
            /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url=https://sonarcloud.io /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.exclusions='**/node_modules/**,**/.next/**,**/wwwroot/lib/**,test-results/**,db/**,**/*.sql,**/coverage/**' \
            /d:sonar.cpd.exclusions='**/Program.cs,**/AuthController.cs,**/*DbContext.cs,**/*OutboxPublisher.cs,**/MfeShell.tsx,**/components/ui/feedback.tsx,**/lib/server/oidc.ts,**/lib/server/session-store.ts' \
            /d:sonar.cs.opencover.reportsPaths="$RUNNER_TEMP/coverage/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="$LCOV_REPORTS" \
            /d:sonar.coverage.exclusions='**/Program.cs,src/Microservices/*/JourneyApi/src/main.ts,src/Microservices/*/BFF.Web/**,src/Shell/**,src/Simulators/**,tst/**,ps/**,deploy/**,.github/**'
          dotnet build EnterpriseWebPlatform.BSS.slnx --configuration Release
          dotnet test tst/dotnet/EwpTests.slnx --configuration Release \
            --collect:"XPlat Code Coverage" --results-directory "$RUNNER_TEMP/coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          "$scanner" end /d:sonar.token="$SONAR_TOKEN"

  # ┌─ SEC ──────────────────────────────────────────────────────────────────────────────────────────
  # │ Snyk Open Source: every NuGet project (after restore) and pnpm lockfile, test projects
  # │ left out like in the CI gate. HIGH and above are reported to Security -> Code scanning
  # │ (SARIF); a finding marks the step, not the run. On main, "snyk monitor" also records what
  # │ main ships, so Snyk alerts when a NEW advisory hits it - without a commit. The CLI is a
  # │ release at least two weeks old, kept only with Snyk's published SHA-256.
  # └────────────────────────────────────────────────────────────────────────────────────────────────
  snyk:
    name: Snyk Open Source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_VERSION: '1.1308.1'
      SNYK_SHA256: 'a8b2e420af6d8e61bf1d367c064475ccf699d767fc8763efb0072b9cac250f9a'
      SNYK_DISABLE_ANALYTICS: '1'
    steps:
      - name: Skipped - no SNYK_TOKEN secret
        if: env.SNYK_TOKEN == ''
        run: echo "### Snyk skipped - no SNYK_TOKEN secret (doc/CI.md, Code scanning)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out
        if: env.SNYK_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        if: env.SNYK_TOKEN != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      # Snyk reads the resolved NuGet graph from obj/project.assets.json.
      - name: Restore
        if: env.SNYK_TOKEN != ''
        run: dotnet restore EnterpriseWebPlatform.BSS.slnx

      - name: Get the Snyk CLI
        if: env.SNYK_TOKEN != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/snyk"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/snyk/snyk" "https://static.snyk.io/cli/v$SNYK_VERSION/snyk-linux"
          echo "$SNYK_SHA256  $RUNNER_TEMP/snyk/snyk" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/snyk/snyk"
          echo "$RUNNER_TEMP/snyk" >> "$GITHUB_PATH"

      - name: Test
        id: test
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: |
          snyk test --all-projects --detection-depth=8 --exclude=tst,test-results \
            --severity-threshold=high --sarif-file-output=snyk-runs.sarif

      # Snyk writes one SARIF run per project (47 today); code scanning accepts at most 20 per
      # upload. One run with every result (rules de-duplicated) keeps them all.
      - name: Merge into one SARIF run
        if: env.SNYK_TOKEN != '' && hashFiles('snyk-runs.sarif') != ''
        run: |
          jq '.runs |= [ { tool: { driver: (.[0].tool.driver + { rules: ([.[].tool.driver.rules[]?] | unique_by(.id)) }) },
                           results: [.[].results[]? | del(.ruleIndex)] } ]' snyk-runs.sarif > snyk.sarif
          echo "Snyk findings: $(jq '.runs[0].results | length' snyk.sarif)"

      - name: Upload to code scanning
        if: env.SNYK_TOKEN != '' && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: snyk.sarif
          category: snyk-open-source

      # Any trigger on main except a pull request: push, the weekly schedule, or by hand.
      - name: Monitor what main ships
        if: env.SNYK_TOKEN != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: snyk monitor --all-projects --detection-depth=8 --exclude=tst,test-results --target-reference=main